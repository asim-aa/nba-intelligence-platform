[project]
name = "nba-intelligence-platform"
version = "0.1.0"
description = "End-to-end NBA pregame win-probability platform."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "nba-api>=1.10,<2",
    "pandas>=2.2,<3",
    "pyarrow>=18,<20",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0,<5",
    "pytest>=8.3,<9",
    "pytest-cov>=6.0,<7",
    "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "pipelines", "modeling"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["app", "pipelines", "modeling"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "pipelines", "modeling", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
